<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>证据问答盲评</title><style>
*{box-sizing:border-box}body{margin:0;background:#edf3f3;color:#15292d;font:15px 'Microsoft YaHei',sans-serif;line-height:1.8}header{position:sticky;top:0;padding:18px 28px;background:#f8fbfb;border-bottom:1px solid #c9d5d7;display:flex;justify-content:space-between;align-items:center;gap:20px;z-index:2}h1{font-size:20px;margin:0}main{max-width:1250px;margin:auto;padding:30px}button,input,select,textarea{font:inherit;border:1px solid #9bb3b5;border-radius:4px;background:white;padding:8px 12px;color:inherit}button{cursor:pointer;min-height:40px}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2a6570;outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.question{font-size:22px;margin:12px 0 26px;overflow-wrap:anywhere}.columns{display:grid;grid-template-columns:1fr 1fr;gap:24px}.sheet{min-width:0;border:1px solid #c9d5d7;padding:24px;background:#f8fbfb}h2{font-size:18px;margin-top:0}.answer,pre{white-space:pre-wrap;overflow-wrap:anywhere}pre{font:13px/1.8 Consolas,monospace;padding:12px;background:#edf3f3;border-left:2px solid #2a6570}.quote{margin:18px 0;padding-top:15px;border-top:1px solid #c9d5d7}small{color:#435e64}a{color:#2a6570}.grade{margin-top:24px;padding:24px;background:#fff;border:1px solid #aabfc0}.grade-grid{display:flex;gap:28px;flex-wrap:wrap}label{display:grid;gap:6px}fieldset{display:flex;gap:18px;align-items:center;border:0;padding:0;margin:0}fieldset label{display:flex;align-items:center;gap:8px}legend{float:left;margin-right:20px}textarea{width:100%;margin-top:10px}#status{color:#2a6570}#restore{font-size:12px}@media(max-width:850px){.columns{grid-template-columns:1fr}header{position:static;flex-direction:column;align-items:start}main{padding:18px}}
</style></head><body><header><div><h1>证据问答盲评</h1><small>不展示检索方式或模型身份。请依据原文独立评分。</small></div><nav><span id="progress"></span><button id="previous">上一题</button><button id="next">下一题</button><button id="export">导出评分 CSV</button></nav></header>
<main><p id="status" role="status"></p><label>评审代号（自行填写）<input id="reviewer" maxlength="80" placeholder="例如：reviewer-A"></label><p id="restore">进度保存在当前浏览器；导出 CSV 后可交回项目进行统计。空白保持未评分。</p><p class="question" id="question"></p><div class="columns"><section class="sheet"><h2>待评回答</h2><p class="answer" id="answer"></p><h3>回答引用</h3><div id="citations"></div></section><section class="sheet"><h2>参考事实与原文</h2><p class="answer" id="reference"></p><ul id="facts"></ul><div id="gold"></div><small>参考标注也可能有误；发现问题请记录说明，不要据此强行给分。</small></section></div><section class="grade"><h2>你的判断</h2><p>正确性要求覆盖必要事实、没有矛盾补充；没有足够证据时应合理拒答。可解释性：1 为无法核验，3 为部分可追溯，5 为结论与引用清晰吻合。</p><div class="grade-grid"><fieldset><legend>答案是否正确</legend><label><input name="correct" type="radio" value="true">正确</label><label><input name="correct" type="radio" value="false">不正确</label><label><input name="correct" type="radio" value="">暂不评分</label></fieldset><label>可解释性评分<select id="explain"><option value="">未评分</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label></div><label>核对说明<textarea id="comment" rows="3" placeholder="可记录遗漏事实、引用问题或参考标注问题"></textarea></label></section></main>
<script type="application/json" id="review-data">__REVIEW_DATA__</script><script>
'use strict';
const data=JSON.parse(document.getElementById('review-data').textContent);
const key='ka-blind-review-'+data.fingerprint;
let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{}
let position=0;const grades=saved.grades||{};
const $=id=>document.getElementById(id);
$('reviewer').value=saved.reviewer||'';
function store(){try{localStorage.setItem(key,JSON.stringify({reviewer:$('reviewer').value,grades}))}catch{}}
function sourceList(id,items){const element=$(id);element.replaceChildren();for(const item of items){const article=document.createElement('article');article.className='quote';const label=document.createElement('small');label.textContent=item.source+' · 第 '+item.start_line+'–'+item.end_line+' 行';article.append(label);const quote=document.createElement('pre');quote.textContent=item.quote;article.append(quote);const source=data.provenance.find(source=>'corpus/'+source.path===item.source);if(source){const link=document.createElement('a');link.href=source.url+'#L'+item.start_line+'-L'+item.end_line;link.target='_blank';link.rel='noopener noreferrer';link.textContent='核对固定提交的原文';article.append(link)}element.append(article)}}
function render(){const row=data.rows[position],grade=grades[row.review_id]||{};$('question').textContent=row.question;$('answer').textContent=row.answer;$('reference').textContent=row.gold_answer;$('facts').replaceChildren();for(const fact of row.required_facts){const li=document.createElement('li');li.textContent=fact;$('facts').append(li)}sourceList('citations',row.citations);sourceList('gold',row.gold_evidence);for(const radio of document.querySelectorAll('[name=correct]'))radio.checked=radio.value===(grade.answer_correct||'');$('explain').value=grade.explainability_score||'';$('comment').value=grade.comment||'';$('progress').textContent=(position+1)+' / '+data.rows.length;$('previous').disabled=position===0;$('next').disabled=position===data.rows.length-1;const complete=Object.values(grades).filter(row=>row.answer_correct!==''&&row.explainability_score).length;$('status').textContent='已评分 '+complete+' / '+data.rows.length+'；未填写内容不会自动补分。'}
function update(){const selected=document.querySelector('[name=correct]:checked');grades[data.rows[position].review_id]={answer_correct:selected?.value||'',explainability_score:$('explain').value,comment:$('comment').value};store()}
for(const item of document.querySelectorAll('[name=correct],#explain,#comment'))item.addEventListener('change',update);
$('reviewer').addEventListener('input',store);$('previous').onclick=()=>{update();position--;render()};$('next').onclick=()=>{update();position++;render()};
$('export').onclick=()=>{update();if(!$('reviewer').value.trim()){alert('请先填写评审代号。');$('reviewer').focus();return}const fields=['review_id','reviewer','answer_correct','explainability_score','comment'];function cell(value){return '"'+String(value??'').replaceAll('"','""')+'"'}const lines=[fields.join(',')];for(const row of data.rows){const grade=grades[row.review_id]||{};lines.push([row.review_id,$('reviewer').value.trim(),grade.answer_correct||'',grade.explainability_score||'',grade.comment||''].map(cell).join(','))}const url=URL.createObjectURL(new Blob(['\ufeff'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}));const link=document.createElement('a');link.href=url;link.download='reviewed-answers.csv';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script></body></html>
