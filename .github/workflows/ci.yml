name: quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      KA_M5_OFFLINE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e '.[dev,evaluation]'
      - run: python -m pytest -p scripts.m5_offline --cov=app --cov-fail-under=90 --cov-report=term-missing --cov-report=xml:../output/backend-coverage.xml
      - run: python -m scripts.prepare_evaluation --dataset ../evaluation --validate-only
      - run: python -m scripts.evaluate_calls --dataset ../evaluation/calls --validate-only
      - run: python -m scripts.project_agent_m5 validate
      - run: python -m scripts.project_agent_m5 preflight --output ../output/m5-ci-preflight
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            output/backend-coverage.xml
            output/m5-ci-preflight/preflight.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: output/frontend-coverage

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: knowledge_atlas
          POSTGRES_USER: knowledge_atlas
          POSTGRES_PASSWORD: ci-only-placeholder
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U knowledge_atlas -d knowledge_atlas"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://knowledge_atlas:ci-only-placeholder@localhost:5432/knowledge_atlas
      PGPASSWORD: ci-only-placeholder
      KA_M5_OFFLINE: '1'
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -e '.[dev]'
      - run: psql -h localhost -U knowledge_atlas -d knowledge_atlas -c 'CREATE EXTENSION IF NOT EXISTS vector'
      - run: python -m scripts.verify_native

  demo-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose build api frontend
